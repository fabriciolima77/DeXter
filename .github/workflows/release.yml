# Gera e publica um release quando uma tag vX.Y.Z e enviada:
#   git tag v0.5.0 && git push origin v0.5.0
# Resultado: DeXter-<versao>-win-x64.zip (portatil, sem instalacao) + SHA256SUMS.txt
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versao (x.y.z) para um build de teste, sem publicar release'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  pacote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (plataforma + build-tools)
        shell: pwsh
        run: |
          $sdkm = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          (1..20 | ForEach-Object { 'y' }) | & $sdkm --licenses | Out-Null
          & $sdkm --install "platforms;android-35" "build-tools;35.0.0" | Out-Null

      - name: Versao
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $v = '${{ github.event.inputs.versao }}' }
          else { $v = '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versao invalida: $v" }
          "VERSAO=$v" >> $env:GITHUB_ENV

      - name: Cache do scrcpy
        uses: actions/cache@v4
        with:
          path: vendor
          key: scrcpy-${{ hashFiles('src/DeXter/DeXter.csproj') }}

      - name: Gerar o zip portatil
        shell: pwsh
        run: ./scripts/pack.ps1 -Versao $env:VERSAO

      - uses: actions/upload-artifact@v4
        with:
          name: DeXter-${{ env.VERSAO }}
          path: dist/*

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DeXter ${{ env.VERSAO }}
          generate_release_notes: true
          files: |
            dist/DeXter-${{ env.VERSAO }}-win-x64.zip
            dist/SHA256SUMS.txt
          body: |
            ## Como usar
            1. Baixe **DeXter-${{ env.VERSAO }}-win-x64.zip**, extraia e abra o **DeXter.exe** (não precisa instalar).
               Se o Windows mostrar "O Windows protegeu o computador": *Mais informações → Executar assim mesmo*.
            2. Ligue a **Depuração USB** no celular e conecte o cabo (ou configure o Wi-Fi pelo menu do ícone). O DeX abre sozinho.

            Requisitos: Windows 10/11 (x64); celular Samsung com DeX e Depuração USB ativa.
            Quem usava a versão 0.3.x (instalada): desinstale antes em Configurações → Aplicativos → DeXter.
